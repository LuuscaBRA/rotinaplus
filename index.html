<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up - Vida Real</title>
    <!-- Adicionamos ?v=2 para forçar o celular a atualizar o visual -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-container" id="app">
        <!-- CABEÇALHO / PERFIL DO JOGADOR -->
        <header class="status-board">
            <div class="profile-section">
                <!-- Mascote Fênix Fofinha -->
                <div class="avatar-box" id="avatar-box">
                    <span class="pet-icon" id="pet-icon">🥚</span>
                </div>
                
                <div class="player-info">
                    <h1 class="title">LEVEL UP</h1>
                    <div class="level-text">NÍVEL <span id="level">1</span> <span class="pet-name" id="pet-name">(Ovinho)</span></div>
                    <div class="streak">🔥 <span id="streak">4</span> DIAS CONSECUTIVOS</div>
                </div>
            </div>
            
            <div class="xp-container">
                <div class="xp-text"><span id="xp">0</span> / <span id="xp-next">500</span> XP</div>
                <div class="xp-bar">
                    <div class="xp-fill" id="xp-fill"></div>
                </div>
            </div>
            
            <div class="currency-box">
                🪙 <span id="lifecash">0</span> LIFECASH
            </div>
        </header>

        <!-- MODO DIA DIFÍCIL (TOGGLE) -->
        <div class="survival-toggle-container">
            <span class="survival-label">🆘 Modo Dia Difícil</span>
            <label class="switch">
                <input type="checkbox" id="survival-toggle" onchange="toggleSurvivalMode()">
                <span class="slider round"></span>
            </label>
        </div>

        <!-- MENSAGEM DO DIA -->
        <div class="daily-quote" id="daily-quote">
            "Um passo de cada vez. Você consegue."
        </div>

        <!-- MISSÕES DIVIDIDAS POR TURNO -->
        <main class="missions-container">
            <div class="time-section" id="morning-section">
                <h2>🌅 MANHÃ</h2>
                <div class="mission-list" id="morning-missions"></div>
            </div>

            <div class="time-section" id="afternoon-section">
                <h2>☀️ TARDE</h2>
                <div class="mission-list" id="afternoon-missions"></div>
            </div>

            <div class="time-section" id="evening-section">
                <h2>🌙 NOITE</h2>
                <div class="mission-list" id="evening-missions"></div>
            </div>
        </main>
        
        <!-- ABA DE CONQUISTAS -->
        <section class="achievements-section">
            <h2>🏆 CONQUISTAS</h2>
            <div class="achievements-grid" id="achievements-grid"></div>
        </section>
    </div>

    <!-- Adicionamos ?v=2 para forçar o celular a baixar o novo Javascript -->
    <script src="script.js?v=2"></script>
</body>
</html>
